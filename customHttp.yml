customHeaders:
  - pattern: '**'
    headers:
      # The admin panel must never be indexed.
      - key: 'X-Robots-Tag'
        value: 'noindex, nofollow, noarchive'
      - key: 'Strict-Transport-Security'
        value: 'max-age=31536000; includeSubDomains'
      - key: 'X-Frame-Options'
        value: 'DENY'
      - key: 'X-Content-Type-Options'
        value: 'nosniff'
      - key: 'Referrer-Policy'
        value: 'strict-origin-when-cross-origin'
      - key: 'Permissions-Policy'
        value: 'camera=(), microphone=(), geolocation=()'
      # connect-src must list the API (cookie auth) and the S3 bucket
      # (presigned PUT uploads go straight from the browser).
      #
      # frame-src is separate and easy to miss: the resume preview renders a
      # short-lived signed S3 URL in an <iframe>, and frames fall back to
      # default-src when frame-src is absent. That is what blocked it -- the
      # panel showed "This content is blocked" with no console error worth
      # reading, which looks like a broken file rather than a header.
      #
      # Only the private bucket is framed. Resumes live there; nothing in the
      # public bucket is ever loaded as a frame.
      #
      # Both API origins are listed. api.awcsoftware.com is where this is
      # heading -- it shares a site with the panel, so cookies work under plain
      # SameSite=Lax. Until that custom domain exists the panel talks to API
      # Gateway directly, and a CSP that named only the first one blocked the
      # login request before it left the browser: the request showed as failed
      # with 0 bytes transferred, which reads like the API being down rather
      # than the page refusing to call it.
      #
      # Keeping both means the switch is one Amplify env var, with no CSP edit
      # and no second round of this.
      - key: 'Content-Security-Policy'
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; frame-src https://awc-s3-pvt.s3.ap-south-1.amazonaws.com; connect-src 'self' https://api.awcsoftware.com https://mnji6yaik3.execute-api.ap-south-1.amazonaws.com https://awc-s3-bucket.s3.ap-south-1.amazonaws.com https://awc-s3-pvt.s3.ap-south-1.amazonaws.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
      - key: 'Server'
        value: 'awcsoftware'
